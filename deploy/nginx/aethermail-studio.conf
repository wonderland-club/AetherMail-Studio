upstream aethermail_gunicorn {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 115.190.255.162;

    client_max_body_size 20m;

    access_log /var/log/nginx/aethermail.access.log;
    error_log /var/log/nginx/aethermail.error.log warn;

    location = / {
        return 302 /aether_mail_studio/;
    }

    location = /aether_mail_studio {
        return 302 /aether_mail_studio/;
    }

    location /aether_mail_studio/ {
        proxy_pass http://aethermail_gunicorn/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /aether_mail_studio;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        return 404;
    }
}
